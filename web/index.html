<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="description"
    content="LysTing — your local solution hub."
  >

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LysTing">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LysTing</title>
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3c67c4">
  <style>
    html, body { margin: 0; background: #3c67c4; }
    #lysting-loader {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box;
      background: #3c67c4; font-family: Arial, sans-serif;
    }
    .loader-wordmark { color: white; font-size: clamp(52px, 12vw, 90px); font-weight: 700; line-height: 1.15; letter-spacing: -1px; }
    .loader-i { position: relative; }
    .loader-sky { position: absolute; left: 50%; top: .23em; width: .25em; height: .25em; transform: translate(-50%, -35%); color: #ffda78; }
    .loader-sky svg { display: block; width: 100%; height: 100%; }
    .loader-sky [hidden] { display: none; }
    .loader-caption { margin: 24px 0 0; color: #ffda78; font-size: clamp(14px, 3.9vw, 28px); line-height: 1.4; text-align: center; }
    .loader-dots { display: inline-flex; gap: .15em; margin-left: .15em; }
    .loader-dots span { animation: lysting-dot 1.2s ease-in-out infinite; }
    .loader-dots span:nth-child(2) { animation-delay: .2s; }
    .loader-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes lysting-dot { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-.15em); } }
    @media (prefers-reduced-motion: reduce) { .loader-dots span { animation: none; opacity: 1; } }
  </style>
</head>
<body>
  <div id="lysting-loader" role="status" aria-label="LysTing. Loading your local solution hub">
    <div class="loader-wordmark" aria-hidden="true">LysT<span class="loader-i">ı<span class="loader-sky">
      <svg id="loader-sun" viewBox="0 0 24 24" hidden><circle cx="12" cy="12" r="5" fill="currentColor"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4.2 4.2l2.1 2.1m11.4 11.4 2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg id="loader-moon" viewBox="0 0 24 24" hidden><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z" fill="currentColor"/></svg>
    </span></span>ng</div>
    <p class="loader-caption" aria-hidden="true">Loading your local solution hub<span class="loader-dots"><span>.</span><span>.</span><span>.</span></span></p>
  </div>
  <script>
    // Use the visitor's local timezone, without asking for location access.
    function updateLoaderSky() {
      const hour = new Date().getHours();
      const day = hour >= 6 && hour < 18;
      document.getElementById('loader-sun').toggleAttribute('hidden', !day);
      document.getElementById('loader-moon').toggleAttribute('hidden', day);
    }
    updateLoaderSky();
    const loaderClock = setInterval(updateLoaderSky, 60000);
    window.addEventListener('flutter-first-frame', function () {
      clearInterval(loaderClock);
      document.getElementById('lysting-loader')?.remove();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
